name: Promote finished games to BotafogoJogos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/TodosOsJogos/ProximosJogos.js'

jobs:
  promote:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout botafogojogos
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run promote script
        run: node scripts/promote-finished-games.js

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/TodosOsJogos/BotafogoJogos2010a2030.js src/TodosOsJogos/ProximosJogos.js
          if git diff --cached --quiet; then
            echo "No finished games found — nothing to commit."
          else
            git commit -m "chore: promote finished games from ProximosJogos to BotafogoJogos"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start them explicitly
      - name: Deploy and sync promoted games
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-on-commit.yml --ref main
          gh workflow run sync-to-mylife.yml --ref main
